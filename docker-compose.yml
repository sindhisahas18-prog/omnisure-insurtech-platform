services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: omnisure
      POSTGRES_PASSWORD: omnisure
      POSTGRES_DB: omnisure
    ports:
      - "5432:5432"
    volumes:
      - omnisure_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnisure"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://omnisure:omnisure@db:5432/omnisure
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./frontend:/frontend
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  omnisure_pgdata:
