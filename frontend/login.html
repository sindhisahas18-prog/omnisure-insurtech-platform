<!DOCTYPE html>
<html class="light" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>OmniSure — Sign in</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script src="/static/js/tailwind-config.js"></script>
</head>
<body class="bg-surface text-on-surface font-body-md text-body-md min-h-screen flex flex-col items-center justify-center px-margin">
  <div class="w-full max-w-sm flex flex-col gap-space-lg">
    <div class="flex flex-col items-center gap-space-xs text-center">
      <div class="flex items-center gap-space-xs">
        <span class="font-headline-lg text-headline-lg text-on-surface tracking-tight">OmniSure</span>
        <span class="px-1.5 py-0.5 rounded-full bg-secondary/10 text-secondary font-label-sm text-label-sm uppercase">AI-Native</span>
      </div>
      <p class="font-body-sm text-body-sm text-on-surface-variant">Sign in to your insurance dashboard</p>
    </div>

    <form id="login-form" class="flex flex-col gap-space-sm p-space-md rounded-2xl bg-surface-container-lowest shadow-sm">
      <label class="flex flex-col gap-1">
        <span class="font-label-md text-label-md text-on-surface-variant">Email</span>
        <input id="email" type="email" required class="px-3 py-2.5 rounded-xl bg-surface-container-low border border-outline-variant text-on-surface font-body-md text-body-md outline-none focus:ring-2 focus:ring-secondary"/>
      </label>
      <label class="flex flex-col gap-1">
        <span class="font-label-md text-label-md text-on-surface-variant">Password</span>
        <input id="password" type="password" required class="px-3 py-2.5 rounded-xl bg-surface-container-low border border-outline-variant text-on-surface font-body-md text-body-md outline-none focus:ring-2 focus:ring-secondary"/>
      </label>

      <p id="error" class="text-error font-body-sm text-body-sm hidden"></p>

      <button type="submit" class="mt-1 w-full py-2.5 rounded-xl bg-secondary text-on-secondary font-label-lg text-label-lg font-semibold shadow-sm active:scale-95 transition-transform">
        Sign in
      </button>
    </form>

    <p class="text-center font-body-sm text-body-sm text-on-surface-variant">
      New to OmniSure? <a href="/signup.html" class="text-secondary font-semibold">Create an account</a>
    </p>
  </div>

  <script src="/static/js/api.js"></script>
  <script>
    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById("error");
      errorEl.classList.add("hidden");

      const body = new URLSearchParams();
      body.set("username", document.getElementById("email").value);
      body.set("password", document.getElementById("password").value);

      try {
        const data = await apiFetch("/auth/login", { method: "POST", body });
        setSession(data.access_token, data.user);
        window.location.href = data.user.role === "admin" ? "/admin.html" : (data.user.role === "employee" ? "/claims-review.html" : "/dashboard.html");
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.classList.remove("hidden");
      }
    });
  </script>
</body>
</html>
