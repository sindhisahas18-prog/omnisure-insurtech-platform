<!DOCTYPE html>
<html class="light" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>OmniSure — Dashboard</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script src="/static/js/tailwind-config.js"></script>
</head>
<body class="bg-surface text-on-surface font-body-md text-body-md flex flex-col min-h-screen">
<header class="sticky top-0 w-full z-50 bg-surface/85 backdrop-blur-xl shadow-[0_1px_12px_rgba(11,28,48,0.03)]">
  <div class="h-16 px-margin flex items-center justify-between">
    <span class="font-headline-sm text-headline-sm tracking-tight text-on-surface">OmniSure</span>
    <div class="flex items-center gap-space-sm">
      <a href="/claims.html" class="font-label-sm text-label-sm text-on-surface-variant">My Claims</a>
      <span id="user-name" class="font-label-md text-label-md text-on-surface-variant"></span>
      <button id="logout-btn" class="px-3 py-1.5 rounded-full bg-surface-container text-on-surface-variant font-label-sm text-label-sm">Sign out</button>
    </div>
  </div>
</header>

<main class="flex-1 flex flex-col w-full px-margin py-space-md gap-space-lg max-w-3xl mx-auto">

  <section class="flex flex-col gap-space-xs">
    <h1 id="welcome" class="font-headline-xl-mobile text-headline-xl-mobile text-on-surface tracking-tight">Welcome</h1>
    <p class="font-body-sm text-body-sm text-on-surface-variant">Here's your coverage at a glance</p>
  </section>

  <section aria-label="Insurance Metrics Summary" class="grid grid-cols-2 gap-space-sm">
    <div class="p-space-md rounded-2xl bg-surface-container-lowest shadow-sm flex flex-col justify-between h-28">
      <span class="font-label-md text-label-md text-on-surface-variant">Active Policies</span>
      <span id="metric-active" class="font-headline-lg text-headline-lg text-on-surface">—</span>
    </div>
    <div class="p-space-md rounded-2xl bg-surface-container-lowest shadow-sm flex flex-col justify-between h-28">
      <span class="font-label-md text-label-md text-on-surface-variant">Total Sum Insured</span>
      <span id="metric-coverage" class="font-currency-display-mobile text-currency-display-mobile text-on-surface">—</span>
    </div>
    <div class="p-space-md rounded-2xl bg-surface-container-lowest shadow-sm flex flex-col justify-between h-28">
      <span class="font-label-md text-label-md text-on-surface-variant">Open Claims</span>
      <span id="metric-claims" class="font-headline-lg text-headline-lg text-on-surface">—</span>
    </div>
    <div class="p-space-md rounded-2xl bg-surface-container-lowest shadow-sm flex flex-col justify-between h-28">
      <span class="font-label-md text-label-md text-on-surface-variant">Renewals (30d)</span>
      <span id="metric-renewals" class="font-headline-lg text-headline-lg text-on-surface">—</span>
    </div>
  </section>

  <section id="advisor" class="flex flex-col gap-space-sm">
    <h2 class="font-headline-sm text-headline-sm text-on-surface">AI Insurance Advisor</h2>
    <form id="advisor-form" class="p-space-md rounded-2xl bg-surface-container-lowest shadow-sm flex flex-col gap-space-sm">
      <select id="advisor-type" required class="px-3 py-2.5 rounded-xl bg-surface-container-low border border-outline-variant"></select>
      <textarea id="advisor-query" required minlength="3" rows="2" placeholder="e.g. What's covered and what's the deductible?" class="px-3 py-2.5 rounded-xl bg-surface-container-low border border-outline-variant resize-none"></textarea>
      <input id="advisor-budget" type="number" min="0" placeholder="Budget in ₹ (optional)" class="px-3 py-2.5 rounded-xl bg-surface-container-low border border-outline-variant"/>
      <button type="submit" class="py-2.5 rounded-xl bg-secondary text-on-secondary font-label-lg text-label-lg font-semibold">Ask the advisor</button>
    </form>
    <div id="advisor-result" class="hidden p-space-md rounded-2xl bg-surface-container-lowest shadow-sm flex flex-col gap-space-sm"></div>
  </section>

  <section class="flex flex-col gap-space-sm">
    <h2 class="font-headline-sm text-headline-sm text-on-surface">Explore insurance</h2>
    <div id="insurance-types" class="grid grid-cols-3 gap-space-sm"></div>
  </section>

  <section class="flex flex-col gap-space-sm">
    <h2 class="font-headline-sm text-headline-sm text-on-surface">My policies</h2>
    <div id="policies-list" class="flex flex-col gap-space-sm">
      <p class="font-body-sm text-body-sm text-on-surface-variant">Loading...</p>
    </div>
  </section>

  <section class="flex flex-col gap-space-sm pb-space-xl">
    <h2 class="font-headline-sm text-headline-sm text-on-surface">Premium service plans</h2>
    <div id="service-plans" class="grid grid-cols-1 gap-space-sm"></div>
  </section>

</main>

<script src="/static/js/api.js"></script>
<script src="/static/js/voice-assistant.js"></script>
<script>
  requireAuth();
  const user = getUser();
  document.getElementById("user-name").textContent = user ? user.full_name : "";
  document.getElementById("welcome").textContent = user ? `Welcome, ${user.full_name.split(" ")[0]}` : "Welcome";

  document.getElementById("logout-btn").addEventListener("click", () => {
    clearSession();
    window.location.href = "/login.html";
  });

  async function loadSummary() {
    const summary = await apiFetch("/dashboard/summary");
    document.getElementById("metric-active").textContent = summary.active_policies;
    document.getElementById("metric-coverage").textContent = formatINR(summary.total_coverage_inr);
    document.getElementById("metric-claims").textContent = summary.open_claims;
    document.getElementById("metric-renewals").textContent = summary.upcoming_renewals;

    const list = document.getElementById("policies-list");
    if (summary.policies.length === 0) {
      list.innerHTML = `<p class="font-body-sm text-body-sm text-on-surface-variant">No policies yet — explore a category above to get an AI recommendation.</p>`;
      return;
    }
    list.innerHTML = summary.policies
      .map(
        (p) => `
      <div class="p-space-md rounded-2xl bg-surface-container-lowest shadow-sm flex flex-col gap-1">
        <div class="flex items-center justify-between">
          <span class="font-headline-sm text-headline-sm text-on-surface">${p.insurance_type.name}</span>
          <span class="px-2 py-0.5 rounded-full bg-surface-container-high text-secondary font-label-sm text-label-sm">${p.status}</span>
        </div>
        <span class="font-body-sm text-body-sm text-on-surface-variant">#${p.policy_number} · ${p.provider_name}</span>
        <div class="flex items-center gap-space-md pt-1">
          <span class="font-body-sm text-body-sm">Premium: <strong>${formatINR(p.premium_inr)}</strong></span>
          ${p.sum_insured_inr ? `<span class="font-body-sm text-body-sm">Sum insured: <strong>${formatINR(p.sum_insured_inr)}</strong></span>` : ""}
        </div>
        <div class="flex items-center gap-2 mt-1">
          ${p.status === "active" ? `<a href="/claims.html?policy_id=${p.id}&type=${p.insurance_type.code}" class="px-3 py-1.5 rounded-xl bg-secondary/10 text-secondary font-label-sm text-label-sm font-semibold">File a Claim</a>` : ""}
          <button data-policy-id="${p.id}" class="explain-policy-btn px-3 py-1.5 rounded-xl bg-surface-container-high text-on-surface-variant font-label-sm text-label-sm font-semibold">Explain this policy</button>
        </div>
        <div data-explain-for="${p.id}" class="hidden font-body-sm text-body-sm text-on-surface-variant whitespace-pre-line border-t border-outline-variant pt-2 mt-1"></div>
      </div>`
      )
      .join("");

    document.querySelectorAll(".explain-policy-btn").forEach((btn) =>
      btn.addEventListener("click", () => explainPolicy(btn.dataset.policyId))
    );

    const explainParam = new URLSearchParams(window.location.search).get("explain");
    if (explainParam) explainPolicy(explainParam);
  }

  async function explainPolicy(policyId) {
    const target = document.querySelector(`[data-explain-for="${policyId}"]`);
    if (!target) return;
    target.classList.remove("hidden");
    target.textContent = "Thinking...";
    target.scrollIntoView({ behavior: "smooth", block: "center" });
    try {
      const result = await apiFetch(`/policies/${policyId}/explain`);
      target.textContent = result.answer + (result.demo_mode ? "\n\n(Demo mode — no LLM key configured.)" : "");
    } catch (err) {
      target.textContent = err.message;
    }
  }

  async function loadInsuranceTypes() {
    const types = await apiFetch("/catalog/insurance-types");
    document.getElementById("insurance-types").innerHTML = types
      .map(
        (t) => `
      <div class="p-space-sm rounded-2xl bg-surface-container-lowest shadow-sm flex flex-col items-center gap-1 text-center">
        <span class="material-symbols-outlined text-secondary text-[22px]">shield</span>
        <span class="font-label-sm text-label-sm text-on-surface">${t.name}</span>
      </div>`
      )
      .join("");
  }

  async function loadServicePlans() {
    const plans = await apiFetch("/catalog/service-plans");
    document.getElementById("service-plans").innerHTML = plans
      .map(
        (p) => `
      <div class="p-space-md rounded-2xl ${p.is_most_popular ? "bg-primary-container text-inverse-on-surface" : "bg-surface-container-lowest"} shadow-sm flex items-center justify-between">
        <div>
          <div class="flex items-center gap-1.5">
            <span class="font-headline-sm text-headline-sm">${p.name}</span>
            ${p.is_most_popular ? '<span class="px-2 py-0.5 rounded-full bg-secondary text-on-secondary font-label-sm text-label-sm">Most Popular</span>' : ""}
          </div>
          <ul class="font-body-sm text-body-sm opacity-80 list-disc list-inside">
            ${p.features.map((f) => `<li>${f}</li>`).join("")}
          </ul>
        </div>
        <span class="font-currency-display-mobile text-currency-display-mobile">${formatINR(p.price_inr)}</span>
      </div>`
      )
      .join("");
  }

  async function populateAdvisorTypes() {
    const types = await apiFetch("/catalog/insurance-types");
    document.getElementById("advisor-type").innerHTML = types.map((t) => `<option value="${t.code}">${t.name}</option>`).join("");
  }

  document.getElementById("advisor-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const resultEl = document.getElementById("advisor-result");
    resultEl.classList.remove("hidden");
    resultEl.innerHTML = `<p class="font-body-sm text-body-sm text-on-surface-variant">Thinking...</p>`;

    const budget = document.getElementById("advisor-budget").value;
    try {
      const data = await apiFetch("/advisor/ask", {
        method: "POST",
        body: JSON.stringify({
          insurance_type_code: document.getElementById("advisor-type").value,
          query: document.getElementById("advisor-query").value,
          budget_inr: budget ? Number(budget) : null,
        }),
      });

      const candidatesHtml = data.candidates.length
        ? `<ul class="list-disc list-inside font-body-sm text-body-sm">${data.candidates
            .map((c) => {
              const parts = [];
              if (c.insurer_name) parts.push(c.insurer_name);
              if (c.premium) parts.push(formatINR(c.premium) + " premium");
              if (c.sum_insured) parts.push(formatINR(c.sum_insured) + " sum insured");
              return `<li>${parts.join(" · ")}</li>`;
            })
            .join("")}</ul>`
        : "";

      resultEl.innerHTML = `
        <p class="font-body-md text-body-md whitespace-pre-line">${data.answer}</p>
        ${candidatesHtml}
        ${data.demo_mode ? '<p class="font-body-sm text-body-sm text-on-surface-variant italic">Running in demo mode (no LLM key configured) — answer is templated directly from your data, not model-generated.</p>' : ""}
      `;
    } catch (err) {
      resultEl.innerHTML = `<p class="text-error font-body-sm text-body-sm">${err.message}</p>`;
    }
  });

  Promise.all([loadSummary(), loadInsuranceTypes(), loadServicePlans(), populateAdvisorTypes()]).catch((err) => {
    console.error(err);
  });

  initVoiceAssistant();
</script>
</body>
</html>
